<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>嘻嘻</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            background: #ffffff;
            font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
            color: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            user-select: none;
        }
        .cover {
            padding: 40px;
        }
        .cover .text {
            font-size: 48px;
            font-weight: 700;
            letter-spacing: 2px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="cover">
        <div class="text">我是小气鬼，我不让你看。</div>
    </div>
</body>
</html>
